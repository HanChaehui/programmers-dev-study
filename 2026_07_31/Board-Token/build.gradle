plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example.spring'
version = '0.0.1-SNAPSHOT'
description = 'Board-Token'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console' //
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3") //
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.4.0' //
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.4.0:jpa' //
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api' //
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api' //
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'  // JWT API
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'    // JWT 구현체
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0' // JSON 처리를 위한 Jackson 모듈
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2' //
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
