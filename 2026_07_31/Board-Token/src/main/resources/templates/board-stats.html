<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://code.jquery.com/jquery-3.7.1.js"
            crossorigin="anonymous"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/boardStats.js}"></script>

    <link th:href="@{/css/boardStats.css}" rel="stylesheet">

    <title>작성자 통계</title>
</head>
<body>

<div class="container">
    <h1>작성자별 게시글 통계</h1>

    <a th:href="@{/}" class="btn">목록으로</a>

    <a href="#"
       class="btn logout-btn logout-btn-position"
       onclick="logout(); return false;">
        로그아웃
    </a>

    <div id="filterForm">
        <label for="minCount">최소 게시글 수</label>

        <input id="minCount"
               type="number"
               min="1"
               value="1">

        <button id="applyBtn"
                class="btn"
                type="button">
            적용
        </button>
    </div>

    <div id="stats">
        <table>
            <thead>
            <tr>
                <th>순위</th>
                <th>작성자</th>
                <th>게시글 수</th>
            </tr>
            </thead>

            <tbody id="statsContent"></tbody>
        </table>
    </div>
</div>

</body>
</html>
