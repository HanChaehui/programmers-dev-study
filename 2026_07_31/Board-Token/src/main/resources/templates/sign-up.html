<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/signUp.js}"></script>
    <link th:href="@{/css/signUp.css}" rel="stylesheet">
    <title>회원가입</title>
</head>
<body>

<div class="signup-container">
    <h2 id="test">회원가입</h2>
    <div>
        <div class="form-group">
            <label for="user_id">아이디</label>
            <input type="text" id="user_id" placeholder="아이디를 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="user_name">이름</label>
            <input type="text" id="user_name" placeholder="이름을 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="role">권한</label>
            <select id="role">
                <option value="ROLE_USER" selected>일반 사용자</option>
                <option value="ROLE_ADMIN">관리자</option>
            </select>
        </div>

        <input id="signup" type="submit" value="회원가입">

        <div class="page-link">
            이미 계정이 있으신가요? <a href="/users/login">로그인</a>
        </div>
    </div>
</div>

</body>
</html>
